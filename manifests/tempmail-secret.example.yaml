# Tempmail config Secret.
#
# api_token + ingest_hmac_secret should be generated with `openssl rand -hex 32`.
# Rotate by re-generating, editing the values below, and re-applying — the
# Deployment's checksum annotation will trigger a pod restart.
#
# Resend stays stubbed; /v1/send returns 500 until you paste a real key.
apiVersion: v1
kind: Secret
metadata:
  name: tempmail-config
  namespace: tempmail
type: Opaque
stringData:
  config.toml: |
    [server]
    listen = "0.0.0.0:8080"
    data_dir = "/data"
    public_base_url = "https://temp-mail.jalencode.com"

    [auth]
    api_token = "REPLACE_WITH_OPENSSL_RAND_HEX_32"
    ingest_hmac_secret = "REPLACE_WITH_OPENSSL_RAND_HEX_32"

    [mail]
    domain = "jalencode.com"
    max_message_bytes = 26214400
    catch_all = true

    [smtp]
    listen = "0.0.0.0:1025"
    hostname = "mail.jalencode.com"
    tls_cert = "/data/tls/fullchain.pem"
    tls_key  = "/data/tls/key.pem"

    [resend]
    # Outbound disabled until a real key is set.
    api_key = "re_REPLACE_ME"
    default_from_name = "Temp Mail"
